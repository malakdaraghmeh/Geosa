<nav aria-label="breadcrumb" *ngIf="breadcrumbs.length">
    <ol class="breadcrumb">
        <li class="breadcrumb-item" *ngFor="let crumb of breadcrumbs; let last = last" [class.active]="last"
            [attr.aria-current]="last ? 'page' : null">
            <ng-container *ngIf="!last; else lastBreadcrumb">
                <a [routerLink]="crumb.url">{{ crumb.label }}</a>
            </ng-container>
            <ng-template #lastBreadcrumb>{{ crumb.label }}</ng-template>
        </li>
    </ol>
</nav>
